<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui)}
.root{padding:16px;max-width:390px}
nav{height:var(--tabbar-height);box-sizing:border-box;padding:6px 8px 0;background:var(--bg);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:flex-start}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:60px;min-height:48px;padding-top:6px;font:500 11px/14px var(--font-ui);color:var(--ink-soft);text-decoration:none}
.tab[aria-current="page"]{color:var(--primary);font-weight:600}
.plus{width:var(--action-size);height:var(--action-size);margin-top:-2px;border-radius:var(--radius-xl);background:var(--action-bg);color:var(--action-fg);display:flex;align-items:center;justify-content:center}
.tab:focus-visible,.plus:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
</style>
</head>
<body>
<div class="root">
  <nav aria-label="Navegación">
    <a class="tab" href="#diario" aria-current="page"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2z"></path><path d="M22 4h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z"></path></svg>Diario</a>
    <a class="tab" href="#amigos"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>Amigos</a>
    <a class="plus" href="#anotar" aria-label="Anotar taza"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg></a>
    <a class="tab" href="#preparar"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="14" r="8"></circle><path d="M10 2h4M12 14l3-3"></path></svg>Preparar</a>
    <a class="tab" href="#yo"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M20 21a8 8 0 0 0-16 0"></path></svg>Yo</a>
  </nav>
</div>
</body>
</html>
