<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui)}
.root{padding:16px;max-width:358px}
h2{margin:0 0 6px;font:600 13px/16px var(--font-ui);color:var(--ink-soft)}
.group{border-radius:var(--radius-md);background:var(--surface);display:flex;flex-direction:column}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px;padding:0 14px;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row:focus-visible{outline:2px solid var(--primary);outline-offset:-2px;border-radius:var(--radius-md)}
.t{display:flex;flex-direction:column;padding:8px 0}
.t b{font:400 15px/22px var(--font-ui)}
.t small{font:400 12px/16px var(--font-ui);color:var(--ink-soft)}
.end{font:400 14px/20px var(--font-ui);color:var(--ink-soft)}
</style>
</head>
<body>
<div class="root">
  <h2>Mi colección</h2>
  <div class="group">
    <a class="row" href="#cafes"><span class="t"><b>Mis cafés</b></span><span class="end">18 ›</span></a>
    <a class="row" href="#wishlist"><span class="t"><b>Quiero probar</b></span><span class="end">5 ›</span></a>
    <a class="row" href="#listas"><span class="t"><b>Personalizar listas</b><small>Métodos, variedades, procesos, sabores</small></span><span class="end">›</span></a>
  </div>
</div>
</body>
</html>
