<!-- @dsCard group="Formularios" height=250 subtitle="Con valor, vacío multilínea, error" -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui)}
.root{padding:16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;max-width:640px}
.f{display:flex;flex-direction:column;gap:8px}
label{font:600 13px/16px var(--font-ui);color:var(--ink-soft)}
label span{font-weight:400}
input,textarea{box-sizing:border-box;border:0;border-radius:var(--radius-sm);background:var(--surface);color:var(--ink);font:400 16px/22px var(--font-ui);padding:0 14px}
input{height:var(--field-height)}
textarea{padding:12px 14px;resize:none}
input::placeholder,textarea::placeholder{color:var(--ink-soft)}
input:focus-visible,textarea:focus-visible{outline:none;box-shadow:0 0 0 2px var(--primary)}
.err input{box-shadow:0 0 0 2px var(--danger)}
.msg{font:400 12px/16px var(--font-ui);color:var(--danger)}
</style>
</head>
<body>
<div class="root">
  <div class="f"><label for="c">Café</label><input id="c" value="Rock natural"></div>
  <div class="f err"><label for="e">Café</label><input id="e" placeholder="Busca o escribe un café" aria-describedby="em"><span class="msg" id="em">Escribe el nombre del café para guardar la nota.</span></div>
  <div class="f" style="grid-column:span 2"><label for="n">Nota <span>(opcional)</span></label><textarea id="n" rows="2" placeholder="Lo que se te quedó de esta taza…"></textarea></div>
</div>
</body>
</html>
