.clock{display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px 0 8px}
.clock-t{font-family:var(--font-data);font-weight:500;font-size:72px;line-height:1;letter-spacing:-.02em}
.bar{width:100%;height:6px;border-radius:99px;background:var(--surface-strong);overflow:hidden;margin-top:14px}
.bar span{display:block;height:100%;background:var(--primary);transition:width 1s linear}
.now{padding:16px;border-radius:var(--radius-lg);background:var(--surface);display:flex;flex-direction:column;gap:4px}
.now-t{font-family:var(--font-display);font-size:24px;line-height:28px}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:14px;align-items:center;min-height:48px;font-size:15px;border-top:1px solid var(--line);color:var(--ink-soft)}
.steps li.cur{color:var(--ink);font-weight:600}.steps li.past{text-decoration:line-through}
.scrim{position:absolute;inset:0;background:rgba(20,23,18,.45);z-index:10;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;top:36px;bottom:0;background:var(--bg);border-radius:var(--radius-sheet) var(--radius-sheet) 0 0;box-shadow:var(--shadow-sheet);z-index:11;animation:up .2s cubic-bezier(.4,0,.2,1);overflow:hidden}
@keyframes up{from{transform:translateY(100%)}}
.sheet-in{height:100%;display:flex;flex-direction:column}
.grab{display:flex;justify-content:center;padding-top:8px}.grab span{width:40px;height:5px;border-radius:99px;background:rgba(47,53,40,.2)}
.sheet-hdr{display:flex;align-items:center;justify-content:space-between;padding:4px 8px}
.sheet-hdr>*{min-width:84px}.sheet-hdr h1{text-align:center;min-width:0}.sheet-hdr .btn:last-child{justify-content:flex-end}
.sheet-body{flex-grow:1;overflow-y:auto;padding:8px 16px 20px;display:flex;flex-direction:column;gap:22px;scrollbar-width:none}
.recents{margin-top:-10px}
.sugg{position:absolute;left:0;right:0;top:78px;background:var(--bg);border-radius:12px;box-shadow:var(--shadow-sheet),0 8px 24px rgba(20,23,18,.12);z-index:3;overflow:hidden}
.sugg button{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;min-height:44px;padding:0 14px}
.sugg button+button{border-top:1px solid var(--line)}
.score-pick{border:0;margin:0;padding:0}
.score-pick legend{padding:0;margin-bottom:10px}
.score-pick>div{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.score-pick button{height:64px;border-radius:14px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:background .2s}
.score-pick button .caption{color:var(--ink-soft);font-size:11px}
.score-pick button.on{background:var(--action-bg)}.score-pick button.on .score{color:var(--action-fg)}.score-pick button.on .caption{color:var(--on-action)}
.dgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sheet-foot{padding:12px 16px 28px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line)}
.share-row{display:flex;align-items:center;justify-content:space-between}
.ic-l{display:flex;align-items:center;gap:8px}
.center-col{align-items:center}
.story{width:236px;aspect-ratio:9/16;border-radius:20px;background:var(--bg);box-shadow:0 0 0 1px var(--line),0 12px 32px rgba(20,23,18,.14);overflow:hidden;display:flex;flex-direction:column;flex-shrink:0}
.story-body{flex-grow:1;padding:120px 16px 16px;display:flex;flex-direction:column;gap:12px}
.story-top{display:flex;gap:8px;align-items:flex-start}
.st-name{font-family:var(--font-display);font-size:28px;line-height:30px}
.st-quote{margin:0;font-family:var(--font-display);font-style:italic;font-size:14px;line-height:19px}
.st-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:baseline}
.st-logo{font-family:var(--font-display);font-size:17px}
.share-opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}
.share-opts button{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:500;min-height:88px;justify-content:center;border-radius:14px}
.share-opts .so-ic{width:52px;height:52px;border-radius:99px;background:var(--surface);display:flex;align-items:center;justify-content:center}
.toast{position:absolute;left:16px;right:16px;bottom:100px;padding:12px 16px;border-radius:14px;background:var(--brand-jungle);color:var(--bg);font-size:14px;z-index:30;animation:fade .2s;text-align:center}
.toast.hi{bottom:120px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="v2-core.jsx"></script>
<script type="text/babel" src="v2-tabs.jsx"></script>
<script type="text/babel" src="v2-push.jsx"></script>
<script type="text/babel" src="v2-sheets.jsx"></script>
<script type="text/babel" src="v2-extra.jsx"></script>
<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "primerUso": false,
  "colorProceso": false,
  "estiloTarjeta": "minimal"
}/*EDITMODE-END*/;
const clone = o => JSON.parse(JSON.stringify(o));
const seedFor = empty => empty ? { ...clone(SEED), notes: [], cafes: [], wishlist: [] } : clone(SEED);

function App() {
  const [tw, setTweak] = useTweaks(TWEAK_DEFAULTS);
  window.SORBO_PROC_COLOR = tw.colorProceso;
  window.SORBO_CARD = tw.estiloTarjeta;
  const [s, setS] = useState(() => seedFor(tw.primerUso));
  window.SORBO_PROCS = Object.fromEntries(s.processes.map(p => [p.name, p.color]));
  const [tab, setTabRaw] = useState(() => localStorage.getItem('sorbo-v2-tab') || 'diario');
  const [stack, setStack] = useState([]);
  const [sheet, setSheet] = useState(null);
  const [msg, setMsg] = useState(null);
  const first = useRef(true);
  useEffect(() => { if (first.current) { first.current = false; return; } setS(seedFor(tw.primerUso)); setStack([]); setSheet(null); setTabRaw('diario'); }, [tw.primerUso]);
  useEffect(() => { localStorage.setItem('sorbo-v2-tab', tab); }, [tab]);
  useEffect(() => { if (!msg) return; const t = setTimeout(() => setMsg(null), 2200); return () => clearTimeout(t); }, [msg]);
  const [scale, setScale] = useState(1);
  useEffect(() => { const f = () => setScale(Math.min(1, (window.innerHeight - 40) / 864, (window.innerWidth - 40) / 410)); f(); window.addEventListener('resize', f); return () => window.removeEventListener('resize', f); }, []);

  const toast = m => setMsg(m);
  const app = {
    s, toast,
    setTab: t => { setStack([]); setTabRaw(t); },
    push: scr => scr.type === 'ratio' ? toast('Calculadora de ratio: sin destino en v2') : setStack(st => [...st, { ...scr, k: Date.now() }]),
    pop: () => setStack(st => st.slice(0, -1)),
    openSheet: sh => setSheet({ ...sh, k: Date.now() }),
    closeSheet: () => setSheet(null),
    toggleCheer: (list, id) => setS(v => ({ ...v, [list]: v[list].map(p => p.id === id ? { ...p, cheered: !p.cheered, cheers: p.cheers + (p.cheered ? -1 : 1) } : p) })),
    toggleFollow: id => setS(v => ({ ...v, discover: v.discover.map(p => p.id === id ? { ...p, follows: !p.follows } : p) })),
    toggleWish: p => {
      const has = s.wishlist.some(w => w.name === p.cafe);
      setS(v => ({ ...v, wishlist: has ? v.wishlist.filter(w => w.name !== p.cafe) : [...v.wishlist, { id: 'w' + Date.now(), name: p.cafe, brand: p.brand, from: p.user, tint: p.tint }] }));
      toast(has ? 'Quitado de Quiero probar' : 'Guardado en Quiero probar');
    },
    addProcess: p => setS(v => ({ ...v, processes: [...v.processes, p] })),
    markRead: () => setS(v => ({ ...v, notifs: v.notifs.map(n => ({ ...n, unread: false })) })),
    saveCafe: c => setS(v => c.id ? { ...v, cafes: v.cafes.map(x => x.id === c.id ? c : x) } : { ...v, cafes: [{ ...c, id: 'c' + Date.now(), brand: c.brand || '[Marca]', tint: TINTS[v.cafes.length % TINTS.length] }, ...v.cafes] }),
    saveNote: d => {
      let cafes = s.cafes, wishlist = s.wishlist, fromWish = false;
      let c = cafes.find(x => x.name.toLowerCase() === d.name.toLowerCase());
      if (!c) {
        const w = wishlist.find(x => x.name.toLowerCase() === d.name.toLowerCase());
        if (w) { wishlist = wishlist.filter(x => x !== w); fromWish = true; }
        c = { id: 'c' + Date.now(), name: d.name, brand: w ? w.brand : d.brand, tint: w ? w.tint : TINTS[cafes.length % TINTS.length], fav: false, origin: '', process: w ? (w.process || '') : '', variety: '', roast: '', price: '' };
        cafes = [c, ...cafes];
      }
      const now = new Date();
      const n = { id: 'n' + Date.now(), cafeId: c.id, rating: d.rating, flavors: d.flavors, text: d.text, method: d.method || '—', dose: d.dose, water: d.water, time: d.time, day: 'Hoy', hour: `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`, cheers: 0 };
      setS({ ...s, cafes, wishlist, notes: [n, ...s.notes] });
      setSheet(null); setTabRaw('diario'); setStack([{ type: 'note', id: n.id, k: Date.now() }]);
      toast(fromWish ? 'Nota guardada · sale de Quiero probar' : 'Nota guardada');
    },
  };
  const Tab = { diario: Diario, amigos: Amigos, preparar: Preparar, yo: Yo }[tab];
  const renderPush = p => p.type === 'search' ? <Search app={app} /> : p.type === 'notifs' ? <Notifications app={app} /> : p.type === 'note' ? <NoteDetail app={app} id={p.id} /> : p.type === 'cafes' ? <MisCafes app={app} filter={p.filter} /> : p.type === 'editCafe' ? <EditCafe app={app} id={p.id} /> : p.type === 'timer' ? <Timer app={app} id={p.id} /> : null;
  return <div className="stage">
    <div className="phone" style={{ transform: `scale(${scale})` }} data-screen-label={stack.length ? stack[stack.length - 1].type : tab}>
      <div className="layer"><Tab app={app} key={tab} /></div>
      {stack.map((p, i) => <div key={p.k} className="layer pushed" style={{ zIndex: 6 + i }}>{renderPush(p)}</div>)}
      {!stack.length && <TabBar tab={tab} setTab={app.setTab} onPlus={() => app.openSheet({ type: 'new' })} />}
      {sheet && <><div className="scrim" onClick={app.closeSheet}></div><div className="sheet" role="dialog" aria-label={sheet.type === 'new' ? 'Nueva nota' : 'Compartir nota'}>{sheet.type === 'new' ? <NewNote key={sheet.k} app={app} prefill={sheet.prefill} /> : <ShareSheet app={app} id={sheet.id} />}</div></>}
      {msg && <div className={'toast' + (stack.length || sheet ? ' hi' : '')} role="status">{msg}</div>}
    </div>
    <TweaksPanel>
      <TweakSection label="Estado" />
      <TweakToggle label="Primer uso (diario vacío)" value={tw.primerUso} onChange={v => setTweak('primerUso', v)} />
      <TweakSection label="Tarjetas" />
      <TweakRadio label="Estilo" value={tw.estiloTarjeta} options={['v1', 'minimal']} onChange={v => setTweak('estiloTarjeta', v)} />
      <TweakToggle label="Color por proceso" value={tw.colorProceso} onChange={v => setTweak('colorProceso', v)} />
    </TweaksPanel>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body></html>
