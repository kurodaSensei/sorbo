# Reglas de Firestore en cada PR y en main.
# (Los tests de UI de v2 quedaron en la rama backup/v2-2026-10-14.)
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    name: Reglas de Firestore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm i -g firebase-tools@15.19.0
      - run: npm run test:rules
